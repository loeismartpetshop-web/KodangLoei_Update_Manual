<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="บันทึกการพัฒนาระบบร้านอาหารสัตว์และโรงแรมแมว แยกดูตามโปรเจกต์และวันที่"
    />
    <meta name="theme-color" content="#faf8f2" id="theme-color" />
    <script>
      (() => {
        const savedTheme = localStorage.getItem("worklog-theme");
        const preferredTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = savedTheme || preferredTheme;
      })();
    </script>
    <title>Work Note | Loei Smart Pet</title>
    <style>
:root {
  color-scheme: light;
  --page: #faf8f2;
  --ink: #111315;
  --muted: #656767;
  --section-line: rgba(17, 19, 21, 0.12);
  --glass: rgba(255, 255, 255, 0.56);
  --glass-soft: rgba(17, 19, 21, 0.055);
  --glass-border: rgba(255, 255, 255, 0.82);
  --glass-highlight: rgba(255, 255, 255, 0.9);
  --glass-text: #15191a;
  --glass-muted: #656b69;
  --control: rgba(255, 255, 255, 0.56);
  --control-border: rgba(255, 255, 255, 0.82);
  --control-text: #15191a;
  --focus-ring: rgba(17, 19, 21, 0.2);
  --lime: #8bcf10;
  --green: #27c979;
  --red: #ff5364;
  --gold: #d99a0d;
  --pink: #e75c89;
  --shadow: 0 24px 72px rgba(35, 37, 38, 0.16);
  --shadow-soft: 0 12px 34px rgba(35, 37, 38, 0.12);
  --radius: 20px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #100e0b;
  --ink: #f5f6f5;
  --muted: #a7aaa9;
  --section-line: rgba(255, 255, 255, 0.11);
  --glass: rgba(244, 247, 247, 0.105);
  --glass-soft: rgba(255, 255, 255, 0.085);
  --glass-border: rgba(255, 255, 255, 0.22);
  --glass-highlight: rgba(255, 255, 255, 0.23);
  --glass-text: #fbfcfc;
  --glass-muted: #c4cac8;
  --control: rgba(255, 255, 255, 0.09);
  --control-border: rgba(255, 255, 255, 0.17);
  --control-text: #f6f7f7;
  --focus-ring: rgba(255, 255, 255, 0.34);
  --shadow: 0 30px 90px rgba(0, 0, 0, 0.48);
  --shadow-soft: 0 15px 40px rgba(0, 0, 0, 0.31);
}
* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  background: var(--page);
}

body {
  position: relative;
  min-width: 320px;
  min-height: 100vh;
  margin: 0;
  overflow-x: hidden;
  background: transparent;
  color: var(--ink);
  font-family: "Noto Sans Thai", "Leelawadee UI", Tahoma, sans-serif;
  line-height: 1.65;
  transition: color 240ms ease;
}

.aura-background {
  position: fixed;
  z-index: -3;
  inset: 0;
  overflow: hidden;
  background: var(--page);
  pointer-events: none;
}

.aura-layer,
.aura-grain {
  position: absolute;
  inset: -16%;
}

.aura-layer-one {
  background: linear-gradient(150deg, #e4e4e7 0%, #d4d4d8 40%, #a1a1aa 70%, #71717a 100%);
  opacity: 0.62;
}

.aura-layer-two {
  background: radial-gradient(circle at 50% 40%, rgba(113, 113, 122, 0.2) 0%, transparent 55%);
  mix-blend-mode: multiply;
  filter: blur(108px);
}

:root[data-theme="dark"] .aura-layer-one {
  background: linear-gradient(150deg, #090a0c 0%, #27272a 40%, #52525b 68%, #71717a 100%);
  opacity: 0.76;
}

:root[data-theme="dark"] .aura-layer-two {
  background: radial-gradient(ellipse 45% 50% at 60% 38%, rgba(212, 212, 216, 0.18) 0%, transparent 68%);
  mix-blend-mode: screen;
  filter: blur(162px);
}

.aura-grain {
  inset: 0;
  background-image:
    repeating-radial-gradient(circle at 17% 31%, rgba(255, 255, 255, 0.18) 0 0.45px, transparent 0.7px 2.8px),
    repeating-linear-gradient(118deg, rgba(17, 19, 21, 0.08) 0 1px, transparent 1px 4px);
  background-size: 4px 4px, 6px 6px;
  mix-blend-mode: overlay;
  opacity: 0.18;
}

button,
select {
  cursor: pointer;
}

button {
  -webkit-tap-highlight-color: transparent;
}

h1,
h2,
h3,
p {
  margin-top: 0;
}

[hidden] {
  display: none !important;
}

.skip-link {
  position: fixed;
  z-index: 100;
  top: 12px;
  left: 16px;
  padding: 10px 14px;
  border-radius: 10px;
  background: #ffffff;
  color: #111517;
  transform: translateY(-160%);
  transition: transform 160ms ease;
}

.skip-link:focus {
  transform: translateY(0);
}

/* Floating controls */
.utility-dock {
  position: fixed;
  z-index: 50;
  top: 18px;
  right: 18px;
  left: 18px;
  display: grid;
  grid-template-columns: minmax(52px, 1fr) auto minmax(52px, 1fr);
  align-items: start;
  pointer-events: none;
}

.theme-toggle,
.project-rail {
  pointer-events: auto;
}

.theme-toggle {
  position: relative;
  grid-column: 3;
  grid-row: 1;
  justify-self: end;
  display: flex;
  gap: 8px;
  align-items: center;
  min-height: 52px;
  padding: 7px 13px 7px 8px;
  overflow: hidden;
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  background:
    linear-gradient(135deg, rgba(255, 255, 255, 0.2), transparent 46%),
    var(--glass);
  color: var(--glass-text);
  box-shadow: var(--shadow-soft), inset 0 1px 0 var(--glass-highlight);
  backdrop-filter: blur(34px) saturate(185%) contrast(105%);
  transition: border-color 160ms ease, transform 160ms ease, box-shadow 160ms ease;
}

.theme-toggle::before,
.project-rail::before {
  position: absolute;
  top: 0;
  right: 9%;
  left: 9%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.86), transparent);
  content: "";
  pointer-events: none;
}

.theme-toggle:hover {
  border-color: var(--focus-ring);
  transform: translateY(-2px);
}

.theme-icon {
  display: grid;
  width: 34px;
  height: 34px;
  place-items: center;
  border: 1px solid var(--section-line);
  border-radius: 10px;
  background: var(--glass-soft);
  font-size: 0.82rem;
}

.theme-label {
  font-size: 0.75rem;
  font-weight: 800;
}

.project-rail {
  position: relative;
  grid-column: 2;
  grid-row: 1;
  justify-self: center;
  width: min(700px, calc(100vw - 154px));
  margin: 0;
  overflow: hidden;
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  background:
    linear-gradient(135deg, rgba(255, 255, 255, 0.18), transparent 42%),
    var(--glass);
  box-shadow: var(--shadow-soft), inset 0 1px 0 var(--glass-highlight);
  backdrop-filter: blur(38px) saturate(190%) contrast(106%);
}

.project-scroll {
  display: flex;
  gap: 8px;
  width: 100%;
  padding: 8px;
  overflow-x: auto;
  overscroll-behavior-inline: contain;
  scroll-behavior: smooth;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
  touch-action: pan-x;
}

.project-scroll::-webkit-scrollbar {
  display: none;
}

.project-tab {
  position: relative;
  display: grid;
  flex: 0 0 auto;
  grid-template-columns: auto minmax(92px, 1fr) auto;
  gap: 9px;
  align-items: center;
  min-width: 192px;
  min-height: 52px;
  padding: 8px 10px;
  border: 1px solid var(--section-line);
  border-radius: 14px;
  background: var(--glass-soft);
  color: var(--glass-text);
  text-align: left;
  scroll-snap-align: center;
  transition: border-color 170ms ease, background 170ms ease, transform 170ms ease, box-shadow 170ms ease;
}

.project-tab:hover {
  border-color: var(--focus-ring);
  transform: translateY(-1px);
}

.project-tab.is-active {
  border-color: rgba(139, 207, 16, 0.52);
  background: rgba(139, 207, 16, 0.12);
  box-shadow: inset 0 0 0 1px rgba(139, 207, 16, 0.05);
}

.project-tab[data-project="pet-store"].is-active {
  border-color: rgba(217, 154, 13, 0.5);
  background: rgba(217, 154, 13, 0.12);
}

.project-tab[data-project="cat-hotel"].is-active {
  border-color: rgba(231, 92, 137, 0.5);
  background: rgba(231, 92, 137, 0.12);
}

.tab-icon {
  display: grid;
  width: 34px;
  height: 34px;
  place-items: center;
  border: 1px solid var(--section-line);
  border-radius: 10px;
  background: var(--glass-soft);
  font-size: 0.64rem;
  font-weight: 900;
}

.tab-icon.all-projects {
  color: var(--lime);
}

.tab-icon.pet-store {
  background: rgba(217, 154, 13, 0.14);
  color: var(--gold);
}

.tab-icon.cat-hotel {
  background: rgba(231, 92, 137, 0.14);
  color: var(--pink);
}

.project-tab strong {
  overflow: hidden;
  font-size: 0.76rem;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.tab-count {
  min-width: 28px;
  padding: 3px 7px;
  border-radius: 8px;
  background: var(--glass-soft);
  color: var(--glass-muted);
  font-size: 0.66rem;
  font-weight: 800;
  text-align: center;
}

.project-tab.is-active .tab-count {
  color: var(--glass-text);
}
/* Main title */
main,
.site-footer {
  width: min(1280px, calc(100% - 64px));
  margin: 0 auto;
}

.hero {
  display: grid;
  min-height: 540px;
  padding: 112px 0 72px;
  place-items: center;
  text-align: center;
}

.hero-title-lockup {
  position: relative;
  display: inline-grid;
  justify-items: center;
  isolation: isolate;
}

.hero-title-lockup::after {
  width: min(360px, 58%);
  height: 2px;
  margin-top: 26px;
  border-radius: 999px;
  background: linear-gradient(90deg, transparent, var(--ink), transparent);
  content: "";
  opacity: 0.24;
  transform: rotate(-2deg);
}

.hero-kicker {
  margin-bottom: 10px;
  color: var(--muted);
  font-family: "Segoe Script", "Brush Script MT", "Lucida Handwriting", cursive;
  font-size: clamp(0.78rem, 1.2vw, 1.08rem);
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: lowercase;
  transform: rotate(-2deg);
}

h1 {
  display: flex;
  gap: 0.04em;
  align-items: baseline;
  justify-content: center;
  margin: 0;
  font-family: "Arial Black", "Leelawadee UI", sans-serif;
  font-size: clamp(5rem, 11vw, 9.5rem);
  line-height: 0.82;
  letter-spacing: -0.09em;
}

h1 span {
  color: transparent;
  font-family: Georgia, "Times New Roman", serif;
  font-style: italic;
  font-weight: 400;
  letter-spacing: -0.1em;
  -webkit-text-stroke: 1.5px var(--ink);
  transform: rotate(-2deg) translateY(-0.02em);
}

h1 em {
  color: var(--ink);
  font-family: Georgia, "Times New Roman", serif;
  font-style: italic;
  font-weight: 400;
  letter-spacing: -0.09em;
  transform: rotate(1deg) translateY(-0.01em);
}

.selected-project-base {
  position: relative;
  display: inline-flex;
  gap: 10px;
  align-items: center;
  width: fit-content;
  max-width: 100%;
  min-height: 42px;
  margin: 0 0 11px;
  padding: 8px 13px;
  overflow: hidden;
  border: 1px solid rgba(139, 207, 16, 0.38);
  border-radius: 14px;
  background:
    linear-gradient(135deg, rgba(255, 255, 255, 0.24), transparent 48%),
    rgba(139, 207, 16, 0.1);
  color: var(--glass-text);
  box-shadow: 0 9px 26px rgba(35, 37, 38, 0.09), inset 0 1px 0 var(--glass-highlight);
  backdrop-filter: blur(28px) saturate(180%);
}

.selected-project-base::before {
  position: absolute;
  top: 0;
  right: 10%;
  left: 10%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.88), transparent);
  content: "";
}

.selected-project-base[data-project="pet-store"] {
  border-color: rgba(217, 154, 13, 0.46);
  background:
    linear-gradient(135deg, rgba(255, 255, 255, 0.24), transparent 48%),
    rgba(217, 154, 13, 0.12);
}

.selected-project-base[data-project="cat-hotel"] {
  border-color: rgba(231, 92, 137, 0.46);
  background:
    linear-gradient(135deg, rgba(255, 255, 255, 0.24), transparent 48%),
    rgba(231, 92, 137, 0.12);
}

.selected-project-base span {
  color: var(--glass-muted);
  font-size: 0.65rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}

.selected-project-base strong {
  overflow: hidden;
  max-width: 210px;
  font-size: 0.98rem;
  line-height: 1.2;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* Work list */
.worklog-section {
  padding: 76px 0;
  border-top: 1px solid var(--section-line);
}

.worklog-title-block {
  min-width: 0;
}

.worklog-heading {
  display: flex;
  gap: 30px;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 26px;
}

.eyebrow {
  margin: 0 0 9px;
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.15em;
}

.worklog-heading h2 {
  margin-bottom: 1px;
  font-size: clamp(2rem, 3.5vw, 3rem);
  line-height: 1.1;
  letter-spacing: -0.045em;
}

.worklog-title-block > p:last-child {
  margin-bottom: 0;
  color: var(--muted);
  font-size: 0.82rem;
}

.view-tools {
  display: flex;
  gap: 9px;
  align-items: center;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.search-box,
.period-button,
.sort-button {
  display: inline-flex;
  align-items: center;
  min-height: 48px;
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  background:
    linear-gradient(135deg, rgba(255, 255, 255, 0.18), transparent 48%),
    var(--glass);
  color: var(--glass-text);
  box-shadow: var(--shadow-soft), inset 0 1px 0 var(--glass-highlight);
  backdrop-filter: blur(28px) saturate(175%);
  transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
}

.search-box {
  gap: 8px;
  min-width: 230px;
  padding-left: 13px;
  color: var(--glass-muted);
}

.search-box input {
  width: 100%;
  min-width: 0;
  padding: 10px 12px 10px 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--glass-text);
}

.search-box input::placeholder {
  color: var(--glass-muted);
}

.period-picker {
  position: relative;
  z-index: 20;
  min-width: 156px;
}

.period-button {
  gap: 14px;
  justify-content: space-between;
  width: 100%;
  padding: 9px 12px 9px 14px;
  text-align: left;
}

.period-chevron {
  display: grid;
  width: 24px;
  height: 24px;
  place-items: center;
  border-radius: 8px;
  background: var(--glass-soft);
  transition: transform 180ms ease;
}

.period-picker.is-open .period-chevron {
  transform: rotate(180deg);
}

.period-menu {
  position: absolute;
  z-index: 30;
  top: calc(100% + 8px);
  right: 0;
  left: 0;
  display: grid;
  gap: 4px;
  min-width: 190px;
  padding: 7px;
  overflow: hidden;
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  background:
    linear-gradient(145deg, rgba(255, 255, 255, 0.2), transparent 42%),
    var(--glass);
  box-shadow: var(--shadow), inset 0 1px 0 var(--glass-highlight);
  backdrop-filter: blur(40px) saturate(190%);
}

.period-option {
  width: 100%;
  padding: 9px 11px;
  border: 1px solid transparent;
  border-radius: 10px;
  background: transparent;
  color: var(--glass-text);
  text-align: left;
  transition: background 140ms ease, border-color 140ms ease;
}

.period-option:hover,
.period-option[aria-selected="true"] {
  border-color: var(--section-line);
  background: var(--glass-soft);
}

.sort-button {
  gap: 7px;
  padding: 9px 13px;
}

.search-box:focus-within,
.theme-toggle:focus-visible,
.project-tab:focus-visible,
.period-button:focus-visible,
.period-option:focus-visible,
.sort-button:focus-visible,
.empty-state button:focus-visible,
.log-card summary:focus-visible {
  outline: 0;
  border-color: var(--focus-ring);
  box-shadow:
    0 0 0 3px var(--focus-ring),
    var(--shadow-soft),
    inset 0 1px 0 var(--glass-highlight);
}
.active-filter {
  min-height: 0;
  margin-bottom: 18px;
  color: var(--muted);
  font-size: 0.82rem;
}

.active-filter:empty {
  display: none;
}

.active-filter strong {
  color: var(--ink);
}

.timeline {
  position: relative;
  display: grid;
  gap: 18px;
}

.timeline::before {
  position: absolute;
  z-index: 0;
  top: 25px;
  bottom: 26px;
  left: 132px;
  width: 2px;
  border-radius: 999px;
  background: var(--red);
  content: "";
}

.timeline[data-order="desc"]::before {
  background: linear-gradient(to bottom, var(--green) 0 4%, rgba(61, 229, 139, 0.3) 7%, rgba(255, 83, 100, 0.36) 13%, var(--red) 100%);
}

.timeline[data-order="asc"]::before {
  background: linear-gradient(to bottom, var(--red) 0 87%, rgba(255, 83, 100, 0.36) 92%, rgba(61, 229, 139, 0.3) 96%, var(--green) 100%);
}

.timeline-entry {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 108px minmax(0, 1fr);
  gap: 46px;
}

.date-column {
  padding-top: 22px;
  text-align: right;
}

.date-column strong,
.date-column span {
  display: block;
}

.date-column strong {
  color: var(--red);
  font-size: 1.62rem;
  line-height: 1;
}

.date-column > span:not(.date-status) {
  margin-top: 6px;
  color: rgba(255, 83, 100, 0.78);
  font-size: 0.73rem;
}

.date-status {
  margin-top: 7px;
  color: var(--green);
  font-size: 0.68rem;
  font-weight: 800;
}

.timeline-entry[data-status="latest"] .date-column strong {
  color: var(--green);
  animation: live-text 1.8s ease-in-out infinite;
}

.timeline-entry[data-status="latest"] .date-column > span:not(.date-status) {
  color: rgba(61, 229, 139, 0.76);
}

.timeline-marker {
  position: absolute;
  top: 24px;
  left: 124px;
  width: 17px;
  height: 17px;
  border: 4px solid var(--page);
  border-radius: 50%;
  background: var(--red);
  box-shadow: 0 0 0 1px rgba(255, 83, 100, 0.55), 0 0 18px rgba(255, 83, 100, 0.24);
}

.timeline-entry[data-status="latest"] .timeline-marker {
  background: var(--green);
  box-shadow: 0 0 0 1px rgba(61, 229, 139, 0.6), 0 0 22px rgba(61, 229, 139, 0.48);
  animation: live-marker 1.8s ease-in-out infinite;
}

.log-card {
  position: relative;
  overflow: hidden;
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  background: var(--glass);
  color: var(--glass-text);
  box-shadow: var(--shadow), inset 0 1px 0 var(--glass-highlight);
  backdrop-filter: blur(28px) saturate(155%);
  transition: border-color 180ms ease, transform 180ms ease;
}

.log-card::before {
  position: absolute;
  z-index: 2;
  top: 0;
  right: 11%;
  left: 11%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.76), transparent);
  content: "";
  pointer-events: none;
}

.log-card:hover {
  transform: translateY(-2px);
}

.timeline-entry[data-status="latest"] .log-card {
  border-color: rgba(61, 229, 139, 0.52);
  box-shadow: var(--shadow), 0 0 45px rgba(61, 229, 139, 0.08), inset 0 1px 0 var(--glass-highlight);
}

.log-card summary {
  position: relative;
  z-index: 3;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 22px;
  align-items: center;
  padding: 22px;
  list-style: none;
  cursor: pointer;
}

.log-card summary::-webkit-details-marker {
  display: none;
}

.card-heading-row {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 9px;
}

.project-label,
.category-label,
.latest-label {
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  padding: 3px 8px;
  border-radius: 8px;
  font-size: 0.68rem;
  font-weight: 800;
}

.latest-label {
  background: var(--green);
  color: #092417;
}

.project-label.pet-store {
  background: rgba(255, 201, 74, 0.15);
  color: #ffd978;
}

.project-label.cat-hotel {
  background: rgba(255, 124, 164, 0.15);
  color: #ffa3c0;
}

.category-label {
  background: var(--glass-soft);
  color: var(--glass-muted);
}

.log-card h3 {
  margin-bottom: 7px;
  color: var(--glass-text);
  font-size: clamp(1.05rem, 2vw, 1.27rem);
  line-height: 1.42;
}

.log-card summary p {
  margin-bottom: 0;
  color: var(--glass-muted);
  font-size: 0.88rem;

const state = {
  project: "all",
  month: "all",
  query: "",
  order: "desc",
};

const timeline = document.querySelector("#timeline");
const emptyState = document.querySelector("#empty-state");
const resultSummary = document.querySelector("#result-summary");
const activeFilter = document.querySelector("#active-filter");
const searchInput = document.querySelector("#search-input");
const monthPicker = document.querySelector("#period-picker");
const monthFilter = document.querySelector("#month-filter");
const monthFilterLabel = document.querySelector("#month-filter-label");
const monthOptions = document.querySelector("#month-options");
const sortButton = document.querySelector("#sort-button");
const themeToggle = document.querySelector("#theme-toggle");
const themeColor = document.querySelector("#theme-color");
const projectScroll = document.querySelector("#project-scroll");
const selectedProjectBase = document.querySelector("#selected-project-base");
const selectedProjectName = document.querySelector("#selected-project-name");

const thaiMonths = [
  "มกราคม",
  "กุมภาพันธ์",
  "มีนาคม",
  "เมษายน",
  "พฤษภาคม",
  "มิถุนายน",
  "กรกฎาคม",
  "สิงหาคม",
  "กันยายน",
  "ตุลาคม",
  "พฤศจิกายน",
  "ธันวาคม",
];

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function parseDate(value) {
  return new Date(`${value}T12:00:00+07:00`);
}

function getBuddhistYear(date) {
  return date.getFullYear() + 543;
}

function getMonthKey(item) {
  return item.date.slice(0, 7);
}

function formatFullDate(value) {
  return new Intl.DateTimeFormat("th-TH-u-ca-buddhist", {
    weekday: "long",
    day: "numeric",
    month: "long",
    year: "numeric",
  }).format(parseDate(value));
}

function formatMonthYear(value) {
  const [year, month] = value.split("-").map(Number);
  return `${thaiMonths[month - 1]} ${year + 543}`;
}

function formatDateColumn(item) {
  if (item.displayDate) {
    return `<strong>${escapeHtml(item.displayDate)}</strong><span>${getBuddhistYear(parseDate(item.date))}</span>`;
  }

  const date = parseDate(item.date);
  return `<strong>${date.getDate()}</strong><span>${thaiMonths[date.getMonth()]} ${getBuddhistYear(date)}</span>`;
}

function createEntry(item, latestDate) {
  const project = projects[item.project];
  const isLatest = item.date === latestDate;
  const details = item.details.map((detail) => `<li>${escapeHtml(detail)}</li>`).join("");
  const latestLabel = isLatest ? '<span class="latest-label">ล่าสุด</span>' : "";
  const timeLabel = item.project === "cat-hotel" ? "เวลาโดยประมาณ" : "ช่วงเวลา";

  return `
    <article class="timeline-entry" data-project="${escapeHtml(item.project)}" data-status="${isLatest ? "latest" : "past"}">
      <div class="date-column" aria-label="${escapeHtml(formatFullDate(item.date))}">
        ${formatDateColumn(item)}
        ${isLatest ? '<span class="date-status">ล่าสุด</span>' : ""}
      </div>
      <span class="timeline-marker" aria-hidden="true"></span>
      <details class="log-card">
        <summary>
          <div>
            <div class="card-heading-row">
              ${latestLabel}
              <span class="project-label ${escapeHtml(item.project)}">${escapeHtml(project.shortName)}</span>
              <span class="category-label">${escapeHtml(item.category)}</span>
            </div>
            <h3>${escapeHtml(item.title)}</h3>
            <p>${escapeHtml(item.summary)}</p>
          </div>
          <span class="expand-icon" aria-hidden="true">+</span>
        </summary>
        <div class="log-details">
          <ul class="completed-list">${details}</ul>
          <aside class="record-meta" aria-label="ข้อมูลอ้างอิงของบันทึก">
            <div>
              <span>วันที่ทำงาน</span>
              <strong>${escapeHtml(formatFullDate(item.date))}</strong>
            </div>
            <div>
              <span>${timeLabel}</span>
              <strong>${escapeHtml(item.time)}</strong>
            </div>
            <div>
              <span>แหล่งข้อมูล</span>
              <strong>${escapeHtml(item.source || project.source)}</strong>
            </div>
          </aside>
        </div>
      </details>
    </article>
  `;
}

function getFilteredLogs() {
  const query = state.query.trim().toLocaleLowerCase("th");
  const filtered = worklogs.filter((item) => {
    const matchesProject = state.project === "all" || item.project === state.project;
    const matchesMonth = state.month === "all" || getMonthKey(item) === state.month;
    const haystack = [item.title, item.summary, item.category, ...item.details].join(" ").toLocaleLowerCase("th");
    const matchesQuery = !query || haystack.includes(query);
    return matchesProject && matchesMonth && matchesQuery;
  });

  return filtered.sort((a, b) => {
    const difference = parseDate(b.date) - parseDate(a.date);
    return state.order === "desc" ? difference : -difference;
  });
}

function updateFilterDescription(filteredCount) {
  const labels = [];

  if (state.month !== "all") {
    labels.push(formatMonthYear(state.month));
  }
  if (state.query.trim()) {
    labels.push(`คำค้น “${escapeHtml(state.query.trim())}”`);
  }

  resultSummary.textContent = `พบ ${filteredCount} รายการ`;
  activeFilter.innerHTML = labels.length
    ? "ตัวกรอง: <strong>" + labels.join(" · ") + "</strong>"
    : "";
}

function render() {
  const filtered = getFilteredLogs();
  const latestVisibleDate = filtered.reduce(
    (latest, item) => (item.date > latest ? item.date : latest),
    "",
  );
  timeline.dataset.order = state.order;
  timeline.innerHTML = filtered.map((item) => createEntry(item, latestVisibleDate)).join("");
  timeline.hidden = filtered.length === 0;
  emptyState.hidden = filtered.length !== 0;
  updateFilterDescription(filtered.length);
}

function setProject(project, centerActive = false) {
  if (!Object.prototype.hasOwnProperty.call(projects, project) && project !== "all") {
    project = "all";
  }

  state.project = project;
  const projectName = project === "all" ? "ทุกโปรเจกต์" : projects[project].name;
  let activeButton = null;

  document.querySelectorAll(".project-tab").forEach((button) => {
    const isActive = button.dataset.project === project;
    button.classList.toggle("is-active", isActive);
    button.setAttribute("aria-selected", String(isActive));

    if (isActive) {
      activeButton = button;
    }
  });

  selectedProjectName.textContent = projectName;
  selectedProjectBase.dataset.project = project;
  history.replaceState(null, "", project === "all" ? "#all" : "#" + project);

  if (centerActive && activeButton) {
    const targetLeft =
      activeButton.offsetLeft - (projectScroll.clientWidth - activeButton.offsetWidth) / 2;
    projectScroll.scrollTo({ left: Math.max(0, targetLeft), behavior: "smooth" });
  }

  render();
}
function closeMonthMenu(restoreFocus = false) {
  monthOptions.hidden = true;
  monthPicker.classList.remove("is-open");
  monthFilter.setAttribute("aria-expanded", "false");

  if (restoreFocus) {
    monthFilter.focus();
  }
}

function setMonth(month, renderNow = true) {
  const availableMonths = new Set(["all", ...worklogs.map(getMonthKey)]);
  state.month = availableMonths.has(month) ? month : "all";
  monthFilterLabel.textContent =
    state.month === "all" ? "ทุกช่วงเวลา" : formatMonthYear(state.month);

  monthOptions.querySelectorAll(".period-option").forEach((option) => {
    option.setAttribute("aria-selected", String(option.dataset.month === state.month));
  });

  closeMonthMenu();

  if (renderNow) {
    render();
  }
}

function populateMonthFilter() {
  const monthKeys = [...new Set(worklogs.map(getMonthKey))].sort().reverse();
  monthKeys.forEach((key) => {
    const option = document.createElement("button");
    option.className = "period-option";
    option.type = "button";
    option.setAttribute("role", "option");
    option.setAttribute("aria-selected", "false");
    option.dataset.month = key;
    option.textContent = formatMonthYear(key);
    monthOptions.append(option);
  });
}
function applyTheme(theme) {
  const isDark = theme === "dark";
  document.documentElement.dataset.theme = theme;
  themeToggle.setAttribute("aria-pressed", String(isDark));
  themeToggle.querySelector(".theme-icon").textContent = isDark ? "☀" : "☾";
  themeToggle.querySelector(".theme-label").textContent = isDark ? "โหมดสว่าง" : "โหมดมืด";
  themeColor.setAttribute("content", isDark ? "#100e0b" : "#faf8f2");
}

function updateProjectCounts() {
  const petStoreCount = worklogs.filter((item) => item.project === "pet-store").length;
  const catHotelCount = worklogs.filter((item) => item.project === "cat-hotel").length;

  document.querySelector('[data-count-for="all"]').textContent = worklogs.length;
  document.querySelector('[data-count-for="pet-store"]').textContent = petStoreCount;
  document.querySelector('[data-count-for="cat-hotel"]').textContent = catHotelCount;
}

document.querySelectorAll(".project-tab").forEach((button) => {
  button.addEventListener("click", () => setProject(button.dataset.project, true));
});

searchInput.addEventListener("input", (event) => {
  state.query = event.target.value;
  render();
});

monthFilter.addEventListener("click", () => {
  const willOpen = monthOptions.hidden;
  monthOptions.hidden = !willOpen;
  monthPicker.classList.toggle("is-open", willOpen);
  monthFilter.setAttribute("aria-expanded", String(willOpen));

  if (willOpen) {
    const selectedOption = monthOptions.querySelector('[aria-selected="true"]');
    selectedOption?.focus();
  }
});

monthOptions.addEventListener("click", (event) => {
  const option = event.target.closest(".period-option");

  if (option) {
    setMonth(option.dataset.month);
  }
});

document.addEventListener("click", (event) => {
  if (!monthPicker.contains(event.target)) {
    closeMonthMenu();
  }
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && !monthOptions.hidden) {
    closeMonthMenu(true);
  }
});
themeToggle.addEventListener("click", () => {
  const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  localStorage.setItem("worklog-theme", nextTheme);
  applyTheme(nextTheme);
});

sortButton.addEventListener("click", () => {
  state.order = state.order === "desc" ? "asc" : "desc";
  sortButton.dataset.order = state.order;
  sortButton.setAttribute("aria-label", state.order === "desc" ? "เรียงจากใหม่ไปเก่า" : "เรียงจากเก่าไปใหม่");
  sortButton.querySelector("span:last-child").textContent = state.order === "desc" ? "ใหม่ → เก่า" : "เก่า → ใหม่";
  render();
});

document.querySelector("#clear-filters").addEventListener("click", () => {
  state.query = "";
  state.order = "desc";
  searchInput.value = "";
  setMonth("all", false);
  sortButton.dataset.order = "desc";
  sortButton.setAttribute("aria-label", "เรียงจากใหม่ไปเก่า");
  sortButton.querySelector("span:last-child").textContent = "ใหม่ → เก่า";
  setProject("all");
});

populateMonthFilter();
setMonth("all", false);
updateProjectCounts();
applyTheme(document.documentElement.dataset.theme || "light");
setProject(window.location.hash.replace("#", "") || "all", true);

    </script>
